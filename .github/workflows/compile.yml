name: Compila DLL per Windows

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Installa il compilatore MinGW
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64
        
    - name: Compila il file in DLL
      run: |
        x86_64-w64-mingw32-gcc -shared -o miocarattere.dll main.c -Wl,--add-stdcall-alias
        
    - name: Salva la DLL come file scaricabile (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: miocarattere-dll
        path: miocarattere.dll
        
